name: Lab boundary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build the isolated Lab package
        run: nix build .#aster-syssec-lab --print-build-logs

      - name: Verify that Lab execution is unavailable
        run: nix run .#syssec-lab -- boundary --json
