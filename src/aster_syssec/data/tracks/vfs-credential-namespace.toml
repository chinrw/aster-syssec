id = "vfs-credential-namespace"
description = "Path resolution, authorization, credentials, mounts, and namespaces"
syscalls = [
  "open", "openat", "access", "faccessat", "faccessat2", "link", "linkat",
  "rename", "renameat", "renameat2", "unlink", "unlinkat", "mkdir",
  "mkdirat", "mknod", "mknodat", "chmod", "fchmod", "fchmodat",
  "fchmodat2", "chown", "fchown", "fchownat", "mount", "umount",
  "umount2", "move_mount", "pivot_root", "chroot", "setns", "unshare",
  "setuid", "setgid", "setresuid", "setresgid", "capset",
]
