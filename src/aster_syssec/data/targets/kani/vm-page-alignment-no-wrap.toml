version = 1
id = "vm-page-alignment-no-wrap"
engine = "kani"
track = "vm-page-cache"
properties = ["BOUNDARY-VALIDATION", "LINUX-ABI-CONTRACT"]
package = "aster-uapi"
harness = "proof_page_alignment_does_not_wrap"
source_symbols = ["checked_page_align"]

[safety]
class = "core"
agent_mode = "allowed"
network = false
may_generate_reproducer = false
requires_authorization = false

[limits]
timeout_seconds = 300
memory_bytes = 8589934592
unwind = 8

[policy]
expected = "pass"
pr_blocking = true
