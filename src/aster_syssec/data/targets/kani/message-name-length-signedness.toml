version = 1
id = "message-name-length-signedness"
engine = "kani"
track = "socket-cmsg-iovec"
properties = ["BOUNDARY-VALIDATION", "LINUX-ABI-CONTRACT"]
package = "aster-uapi"
harness = "proof_message_name_length_preserves_signedness"
source_symbols = ["CUserMsgHdr", "MessageHeaderError", "validated_name_len"]

[safety]
class = "core"
agent_mode = "allowed"
network = false
may_generate_reproducer = false
requires_authorization = false

[limits]
timeout_seconds = 300
memory_bytes = 8589934592
unwind = 8

[policy]
expected = "pass"
pr_blocking = true
