version = 1
id = "iovec-nonnegative-length"
engine = "kani"
track = "user-memory-partial-io"
properties = ["BOUNDARY-VALIDATION", "LINUX-ABI-CONTRACT"]
package = "aster-uapi"
harness = "proof_nonnegative_iovec_length_preserves_value"
