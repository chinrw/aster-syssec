version = 1
id = "iovec-entry-address-no-wrap"
engine = "kani"
track = "user-memory-partial-io"
properties = ["BOUNDARY-VALIDATION", "LINUX-ABI-CONTRACT"]
package = "aster-uapi"
harness = "proof_iovec_entry_address_no_wrap"
