version = 1
id = "message-iovec-count-limit"
engine = "kani"
track = "socket-cmsg-iovec"
properties = ["BOUNDARY-VALIDATION", "LINUX-ABI-CONTRACT"]
package = "aster-uapi"
harness = "proof_message_iovec_count_obeys_the_linux_limit"
source_symbols = ["CUserMsgHdr", "MAX_IO_VECTOR_LENGTH", "validated_iov_len"]

[safety]
class = "core"
agent_mode = "allowed"
network = false
may_generate_reproducer = false
requires_authorization = false

[limits]
timeout_seconds = 300
memory_bytes = 8589934592
unwind = 8

[policy]
expected = "pass"
pr_blocking = true
