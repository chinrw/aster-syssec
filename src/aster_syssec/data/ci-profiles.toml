version = 1

[profiles.pr]
implemented_commands = ["config-check", "inventory --check", "review --changed-from"]
targets = [
  "iovec-negative-length",
  "iovec-nonnegative-length",
  "iovec-entry-address-no-wrap",
  "iovec-supported-index-offset",
  "iovec-truncation-budget",
  "user-iovec-layout",
  "user-iovec-x86-64",
  "fd-reservation-visibility",
]
blocking = [
  "structural catalog drift",
  "baseline dispatch or coverage regression",
  "known candidate policy selected by --fail-on-candidates",
]
external_required = ["make check", "targeted regression", "known reproducer replay"]
fail_fast = true

[profiles.nightly]
implemented_commands = ["inventory --check", "review"]
targets = [
  "iovec-negative-length",
  "iovec-nonnegative-length",
  "iovec-entry-address-no-wrap",
  "iovec-supported-index-offset",
  "iovec-truncation-budget",
  "user-iovec-layout",
  "user-iovec-x86-64",
  "user-iovec-riscv64",
  "user-iovec-loongarch64",
  "iovec-host-fuzz",
  "fd-reservation-visibility",
]
external_required = [
  "SMP regression", "LTP", "kselftest", "gVisor", "differential corpus",
]
fail_fast = false

[profiles.weekly]
implemented_commands = ["model --stage analysis"]
external_required = [
  "human Gate 1 review", "kernel sequence fuzzing", "xfstests",
  "fault injection", "cross-architecture replay",
]

[profiles.release]
implemented_commands = ["inventory --check --baseline"]
external_required = [
  "confirmed reproducer replay", "regression promotion audit",
  "cross-architecture UAPI layout lock", "untriaged crash audit",
]
